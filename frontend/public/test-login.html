<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .log { margin: 5px 0; padding: 5px; background: #f0f0f0; }
        .error { background: #ffe6e6; color: red; }
        .success { background: #e6ffe6; color: green; }
        .info { background: #e6f3ff; color: blue; }
    </style>
</head>
<body>
    <h1>Authentication Flow Test</h1>
    <div id="logs"></div>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <script type="module">
        let logContainer = document.getElementById('logs');
        
        // Override console methods to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog(...args);
            addLog(args.join(' '), 'info');
        };
        
        console.error = (...args) => {
            originalError(...args);
            addLog(args.join(' '), 'error');
        };
        
        console.warn = (...args) => {
            originalWarn(...args);
            addLog(args.join(' '), 'warn');
        };
        
        window.clearLogs = () => {
            logContainer.innerHTML = '';
        };
        
        window.testLogin = async () => {
            try {
                console.log("=== STARTING LOGIN TEST ===");
                
                // Clear localStorage first
                localStorage.clear();
                console.log("Cleared localStorage");
                
                // Import the auth service
                const { authService } = await import('/src/services/authService.js');
                
                // Try to login
                const result = await authService.loginOffice('sdo@adzu.edu.ph', 'sdo123');
                console.log("Login result:", JSON.stringify(result, null, 2));
                
                // Check localStorage immediately
                console.log("=== CHECKING LOCALSTORAGE AFTER LOGIN ===");
                console.log("authToken:", localStorage.getItem("authToken"));
                console.log("userType:", localStorage.getItem("userType"));
                console.log("userData:", localStorage.getItem("userData"));
                
                // Test verify token
                console.log("=== TESTING VERIFY TOKEN ===");
                const verification = authService.verifyToken();
                console.log("Verification:", JSON.stringify(verification, null, 2));
                
                addLog("LOGIN TEST COMPLETED SUCCESSFULLY", 'success');
                
            } catch (error) {
                console.error("Login test failed:", error.message);
                addLog("LOGIN TEST FAILED", 'error');
            }
        };
        
        // Auto-run the test when page loads
        window.addEventListener('load', () => {
            setTimeout(testLogin, 1000);
        });
    </script>
</body>
</html>
