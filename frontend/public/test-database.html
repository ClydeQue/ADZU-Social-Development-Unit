<!DOCTYPE html>
<html>
<head>
    <title>Database Test</title>
    <script type="module">
        import { supabase } from './src/lib/supabase.js';
        
        async function testDatabase() {
            console.log('🔍 Testing database connections...');
            
            // Test office users
            const { data: offices, error: officeError } = await supabase
                .from('office_users')
                .select('email, id, name')
                .limit(5);
                
            console.log('📋 Office Users:', offices, officeError);
            
            // Test unit directors  
            const { data: directors, error: directorError } = await supabase
                .from('unit_directors')
                .select('email, id, name')
                .limit(5);
                
            console.log('👔 Unit Directors:', directors, directorError);
            
            // Display results
            document.getElementById('results').innerHTML = `
                <h3>Office Users:</h3>
                <pre>${JSON.stringify(offices, null, 2)}</pre>
                <h3>Unit Directors:</h3>
                <pre>${JSON.stringify(directors, null, 2)}</pre>
            `;
        }
        
        // Run test when page loads
        testDatabase();
    </script>
</head>
<body>
    <h1>🔍 Database Test</h1>
    <p>Check console for results</p>
    <div id="results"></div>
</body>
</html>
