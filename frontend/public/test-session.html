<!DOCTYPE html>
<html>
<head>
    <title>React Query Session Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .log { margin: 5px 0; padding: 5px; background: #f0f0f0; }
        .error { background: #ffe6e6; color: red; }
        .success { background: #e6ffe6; color: green; }
        .info { background: #e6f3ff; color: blue; }
    </style>
</head>
<body>
    <h1>React Query Session Check Test</h1>
    <div id="logs"></div>
    <button onclick="testSessionCheck()">Test Session Check</button>
    <button onclick="testFullFlow()">Test Full Flow (Login + Session Check)</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <script type="module">
        let logContainer = document.getElementById('logs');
        
        // Override console methods to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        
        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog(...args);
            addLog(args.join(' '), 'info');
        };
        
        console.error = (...args) => {
            originalError(...args);
            addLog(args.join(' '), 'error');
        };
        
        window.clearLogs = () => {
            logContainer.innerHTML = '';
        };
        
        window.testSessionCheck = async () => {
            try {
                console.log("=== TESTING SESSION CHECK (React Query Logic) ===");
                
                // Import the auth service
                const { authService } = await import('/src/services/authService.js');
                
                // Simulate what React Query does
                const queryFn = () => {
                    try {
                        console.log("=== REACT QUERY SESSION CHECK ===");
                        console.log("Checking localStorage keys:", Object.keys(localStorage));
                        console.log("localStorage length:", localStorage.length);
                        
                        const result = authService.verifyToken();
                        console.log("Session verification result:", JSON.stringify(result, null, 2));

                        if (result.error || !result.user) {
                            console.log("No valid session found", result.error);
                            
                            // Let's also check what's actually in localStorage right now
                            console.log("Current localStorage state:");
                            console.log("  authToken:", localStorage.getItem("authToken"));
                            console.log("  userType:", localStorage.getItem("userType"));
                            console.log("  userData:", localStorage.getItem("userData"));
                            
                            console.log("=== REACT QUERY SESSION CHECK END - NO SESSION ===");
                            return null;
                        }

                        console.log("Valid session found:", result);
                        console.log("=== REACT QUERY SESSION CHECK END - SUCCESS ===");
                        return {
                            token: result.token,
                            userType: result.userType,
                            user: result.user,
                        };
                    } catch (error) {
                        console.error("Session verification failed:", error);
                        console.log("=== REACT QUERY SESSION CHECK END - ERROR ===");
                        return null;
                    }
                };
                
                const sessionResult = queryFn();
                console.log("Final session result for React Query:", sessionResult);
                
                if (sessionResult) {
                    addLog("SESSION CHECK: AUTHENTICATED", 'success');
                } else {
                    addLog("SESSION CHECK: NOT AUTHENTICATED", 'error');
                }
                
            } catch (error) {
                console.error("Session check test failed:", error.message);
                addLog("SESSION CHECK TEST FAILED", 'error');
            }
        };
        
        window.testFullFlow = async () => {
            try {
                console.log("=== TESTING FULL AUTHENTICATION FLOW ===");
                
                // Clear localStorage first
                localStorage.clear();
                console.log("Cleared localStorage");
                
                // Import the auth service
                const { authService } = await import('/src/services/authService.js');
                
                // Step 1: Login
                console.log("Step 1: Logging in...");
                const loginResult = await authService.loginOffice('sdo@adzu.edu.ph', 'sdo123');
                console.log("Login result:", JSON.stringify(loginResult, null, 2));
                
                // Step 2: Wait a moment and check localStorage
                console.log("Step 2: Checking localStorage after login...");
                await new Promise(resolve => setTimeout(resolve, 100));
                console.log("authToken:", localStorage.getItem("authToken"));
                console.log("userType:", localStorage.getItem("userType"));
                console.log("userData:", localStorage.getItem("userData"));
                
                // Step 3: Simulate React Query session check
                console.log("Step 3: Simulating React Query session check...");
                await testSessionCheck();
                
                addLog("FULL FLOW TEST COMPLETED", 'success');
                
            } catch (error) {
                console.error("Full flow test failed:", error.message);
                addLog("FULL FLOW TEST FAILED", 'error');
            }
        };
    </script>
</body>
</html>
